name: Build Release

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The unit test (framing regression over a loopback Iroh pair) only needs
    # Linux — the shippable binary is Windows-only, but the crate now compiles
    # on Linux too thanks to the tap facade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ubuntu-test

      - name: Test
        run: cargo test

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Lisätään Rust-työkaluketju
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Lisätään välimuisti
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # Tämä varmistaa, että välimuisti on juuri tälle koodille
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # fakevpn on Far Cry 4 -coopia varten Windows-ohjelma; Linux-julkaisu
          # varmistaa vain että koodi kääntyy, mutta ladataan ylös molemmat.
          name: fakevpn-${{ matrix.os }}
          path: target/release/fakevpn*
